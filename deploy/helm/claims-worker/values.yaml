# Default values for claims-worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
serviceAccountName: claims-worker-sa
image:
  # Must be set to this project's own claims-worker image, e.g.
  # <your-registry>.azurecr.io/claims-worker. There is intentionally no default:
  # rendering the chart fails unless the repository is supplied explicitly.
  repository: ""
  pullPolicy: IfNotPresent
  # Preferred: pin an immutable digest (sha256:...). When set, the tag is ignored.
  digest: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

service:
  type: ClusterIP
  port: 80

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env:
  configmap:
    - name: AzureWebJobsStorage__accountName
    - name: CoreClaimsCosmosDB__accountEndpoint
    - name: CoreClaimsEventHub__fullyQualifiedNamespace
    - name: BusinessRuleOptions__AutoApproveThreshold
    - name: BusinessRuleOptions__RequireManagerApproval
    - name: BusinessRuleOptions__DemoMode
    - name: BusinessRuleOptions__DemoAdjudicatorId
    - name: BusinessRuleOptions__DemoManagerAdjudicatorId
    - name: ClientId
  secret:
    - name: ApplicationInsights__ConnectionString
  values:
    - name: ASPNETCORE_ENVIRONMENT
      value: Production