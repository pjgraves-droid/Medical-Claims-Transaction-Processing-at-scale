name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/CoreClaims.sln
      - name: Build
        run: dotnet build src/CoreClaims.sln --no-restore -c Release
      - name: Unit and API smoke tests
        run: dotnet test src/CoreClaims.sln --no-build -c Release --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"
      - name: Cosmos DB repository tests (emulator via Testcontainers)
        run: dotnet test src/CoreClaims.sln --no-build -c Release --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/medical-claims-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/medical-claims-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
